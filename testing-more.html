<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>scratchy thing</title>

<script>
    alert("Note: This game is large and it's gonna lag on your chromebook/any not so powerful device like crazy, we recommend running this with a device that can run large PC games to avoid some lag issues probably, if it doesn't work, feel free to join the daknux dc and report it as a bug or just play any other game");
    </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #111;
      z-index: 10;
    }

    .box {
      width: 360px;
      max-width: 85%;
    }

    .title {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .status {
      color: #888;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .track {
      height: 7px;
      background: #292929;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      background: #4c8dff;
      transition: width .15s;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="box">
      <div class="title" id="title">Loading...</div>
      <div class="status" id="status">Downloading project...</div>

      <div class="track">
        <div class="bar" id="bar"></div>
      </div>

      <div class="info">
        <span id="size">0 MB</span>
        <span id="percent">0%</span>
      </div>
    </div>
  </div>

  <script>
    const ZIP =
      "index.zip";

    const $ = id => document.getElementById(id);

    const mb = n =>
      (n / 1024 / 1024).toFixed(2) + " MB";

    async function load() {
      const res = await fetch(ZIP);

      if (!res.ok)
        throw new Error("Download failed: " + res.status);

      const total =
        Number(res.headers.get("content-length")) || 0;

      const reader = res.body.getReader();
      const chunks = [];
      let loaded = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        chunks.push(value);
        loaded += value.length;

        if (total) {
          const p = Math.round(loaded / total * 100);
          $("bar").style.width = p + "%";
          $("percent").textContent = p + "%";
          $("size").textContent =
            mb(loaded) + " / " + mb(total);
        } else {
          $("size").textContent = mb(loaded);
        }
      }

      $("title").textContent = "Extracting...";
      $("status").textContent = "Reading project...";

      const data = new Uint8Array(loaded);
      let offset = 0;

      for (const chunk of chunks) {
        data.set(chunk, offset);
        offset += chunk.length;
      }

      const zip = await JSZip.loadAsync(data);

      $("title").textContent = "Merging...";
      $("status").textContent = "Reassembling project...";

      // Group every "*.partN" entry in the zip by its base name,
      // e.g. "index.html.part1" + "index.html.part2" -> base "index.html"
      const groups = new Map();

      for (const f of Object.values(zip.files)) {
        if (f.dir) continue;
        const m = f.name.match(/^(.*)\.part(\d+)$/i);
        if (!m) continue;
        const base = m[1];
        const num = parseInt(m[2], 10);
        if (!groups.has(base)) groups.set(base, []);
        groups.get(base).push({ num, file: f });
      }

      // Usually there's just one group; if there are several, merge the largest.
      let parts = [];
      for (const list of groups.values()) {
        if (list.length > parts.length) parts = list;
      }
      parts.sort((a, b) => a.num - b.num);

      let html;       // final page as a Blob
      let sourceName; // name shown on the status line

      if (parts.length) {
        const chunks = [];
        for (let i = 0; i < parts.length; i++) {
          chunks.push(await parts[i].file.async("arraybuffer"));
          const p = Math.round((i + 1) / parts.length * 100);
          $("bar").style.width = p + "%";
          $("status").textContent =
            "Merging " + (i + 1) + " / " + parts.length + " parts...";
        }
        html = new Blob(chunks, { type: "text/html" });
        sourceName = parts[0].file.name.replace(/\.part\d+$/i, "");
      } else {
        // No ".part" files: fall back to a plain HTML file, as before.
        const htmlFile = Object.values(zip.files)
          .find(f => !f.dir && /\.html?$/i.test(f.name));
        if (!htmlFile) throw new Error("No HTML file found.");

        html = new Blob([await htmlFile.async("blob")], { type: "text/html" });
        sourceName = htmlFile.name;
      }

      $("title").textContent = "Starting game...";
      $("status").textContent = sourceName;

      const url = URL.createObjectURL(html);
      location.replace(url);
    }

    load().catch(err => {
      console.error(err);

      $("title").textContent = "Failed to load";
      $("status").textContent = err.message;
      $("bar").style.background = "#e44";
    });
  </script>
</body>
</html>
